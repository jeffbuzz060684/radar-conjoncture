name: Relevé quotidien data-daily.json
on:
  schedule:
    - cron: "45 21 * * 1-5" # 21:45 UTC ≈ 23:45 Paris (été) — après la clôture US
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # redéclencher pages.yml : un push au GITHUB_TOKEN ne déclenche AUCUN workflow
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relever les marchés (IWDA EUR + VIX lissé + macro BCE/Eurostat) et valider
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # v5.6 : notification palier app fermée — sujet long et aléatoire, jamais en dur (dépôt public)
        run: node tools/fetch-daily.js
      - name: Commiter si changé
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-daily.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data-daily.json inchangé — pas de commit."
          else
            git commit -m "Relevé quotidien $(date -u +%F) — IWDA EUR/VIX/macro (Yahoo+ECB+Eurostat)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redéployer GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
